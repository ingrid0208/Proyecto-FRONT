<app-topbar></app-topbar>

<mat-card class="payment-fines-card">
  <app-card-header
    title="Selección de Multas para Acuerdo de Pago"
    [description]="ciudadano ? 'Ciudadano: ' + ciudadano : 'Seleccione las multas que desea incluir en el acuerdo de pago.\nPuede elegir una o varias multas para generar el acuerdo.'">
  </app-card-header>

  <app-generic-multas-table
    [data]="multas"
    [columns]="columns">
  </app-generic-multas-table>

  <mat-card-actions align="end">
    <button mat-raised-button color="accent" (click)="onClickGenerar()">
      {{ botonTexto }}
    </button>
  </mat-card-actions>
</mat-card>
