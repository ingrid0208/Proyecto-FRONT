 <app-topbar></app-topbar>
<div class="notificaciones-container">

  <!-- Banner -->
  <div class="banner">
    Notificación de nuevas multas
  </div>

  <!-- Datos del usuario -->
  <div class="usuario-card">
    <div class="usuario-nombre">{{ usuario.nombre }}</div>
    <div class="usuario-cc">CC: {{ usuario.cc }}</div>

    <div class="usuario-stats">
      <div class="stat">
        <span>{{ usuario.acuerdosPago }}</span>
        <small>Total Acuerdos de pago</small>
      </div>
      <div class="stat">
        <span>{{ usuario.nuevasNotificaciones }}</span>
        <small>Nuevas notificaciones</small>
      </div>
    </div>
  </div>

  <!-- Lista de multas -->
  <div class="multas-section">
    <h3>Vista previa de nuevas multas</h3>
    <app-multa-card *ngFor="let multa of multas" [multa]="multa"></app-multa-card>
  </div>

</div>
