<app-topbar></app-topbar>

<div class="form-container">
  <h2>Crear Acuerdo de Pago</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-grid">

      <!-- Columna izquierda -->
      <div class="form-column">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="initData.personName" name="personName" readonly />

        <label>Número de Documento</label>
        <input type="text" [(ngModel)]="initData.documentNumber" name="documentNumber" readonly />

        <label>Tipo de Documento</label>
        <input type="text" [(ngModel)]="initData.documentType" name="documentType" readonly />

        <label>Número de Teléfono</label>
        <input type="text" [(ngModel)]="form.phoneNumber" name="phoneNumber" placeholder="Ingrese su teléfono" />

        <label>Dirección</label>
        <input type="text" [(ngModel)]="form.address" name="address" placeholder="Ingrese su dirección" />

        <!-- 🚀 Nuevo campo Barrio -->
        <label>Barrio</label>
        <input type="text" [(ngModel)]="form.neighborhood" name="neighborhood" placeholder="Ingrese su barrio" />

        <label>Método de Pago</label>
        <select [(ngModel)]="form.typePaymentId" name="typePaymentId">
          <option value="">Seleccione</option>
          <option *ngFor="let tp of typePayments" [ngValue]="tp.id">{{tp.name}}</option>
        </select>

        <label>Frecuencia de Pago</label>
        <select [(ngModel)]="form.paymentFrequencyId" name="paymentFrequencyId">
          <option value="">Seleccione</option>
          <option *ngFor="let f of paymentFrequencies" [ngValue]="f.id">{{f.intervalPage}}</option>
        </select>
      </div>

      <!-- Columna derecha -->
      <div class="form-column">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="form.email" name="email" placeholder="Ingrese su correo" />

        <label>Inicio del Acuerdo</label>
        <input type="date" [(ngModel)]="form.agreementStart" name="agreementStart" />

        <label>Fin del Acuerdo</label>
        <input type="date" [(ngModel)]="form.agreementEnd" name="agreementEnd" />

        <label>Infracción Cometida</label>
        <input type="text" [(ngModel)]="initData.infringement" name="infringement" readonly />

        <label>Tipo de Multa</label>
        <input type="text" [(ngModel)]="initData.typeFine" name="typeFine" readonly />

        <label>Valor en SMDLV</label>
        <input type="number" [(ngModel)]="initData.valorSMDLV" name="valorSMDLV" readonly />

        <label>Información de la Infracción</label>
        <textarea rows="4" [(ngModel)]="form.agreementDescription" name="agreementDescription"
          placeholder="Ingrese detalles adicionales..."></textarea>
      </div>
    </div>

    <button type="submit" class="submit-btn green">
      Generar Acuerdo de Pago
    </button>
  </form>
</div>
