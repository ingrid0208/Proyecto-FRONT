  <div class="topbar">
    <button class="menu-btn layout-menu-button" (click)="onMenuClick()" title="Abrir/Cerrar Menú">
      <i class="pi pi-bars"></i>
    </button>

    <!-- Buscador central -->
    <div class="search-box">
      <i class="pi pi-search"></i>
      <input 
        type="text" 
        placeholder="Buscador" 
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />
    </div>

    <!-- Notificaciones y Perfil -->
    <div class="right-section">
      <button class="icon-btn">
        <i class="pi pi-bell"></i>
      </button>

      <button class="profile-btn" (click)="op.toggle($event)">
        <span class="user-name">Daniel Caicedo</span>
        <i class="pi pi-chevron-down"></i>
      </button>

      <p-overlayPanel #op [showCloseIcon]="true">
        <div class="menu-item" (click)="goToProfile()">
          <i class="pi pi-user"></i> Ver Perfil
        </div>
        <div class="menu-item" (click)="openSettings()">
          <i class="pi pi-cog"></i> Configuración
        </div>
        <div class="menu-item logout" (click)="logout()">
          <i class="pi pi-sign-out"></i> Cerrar Sesión
        </div>
      </p-overlayPanel>
    </div>
  </div>
