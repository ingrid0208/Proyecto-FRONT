  <div class="topbar">
    <button class="menu-btn" (click)="layoutService.onMenuToggle()">
      <i class="pi pi-bars"></i>
    </button>

    <!-- Buscador central -->
    <div class="search-box" [class.search-hidden]="isSearchHidden">
      <i class="pi pi-search"></i>
      <input
        type="text"
        placeholder="Buscador"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />
    </div>

    <!-- Botón de búsqueda móvil -->
    <button class="search-toggle-btn" (click)="toggleSearch()">
      <i class="pi pi-search"></i>
    </button>

    <!-- Notificaciones y Perfil -->
    <div class="right-section">
      <button class="icon-btn notification-btn">
        <i class="pi pi-bell"></i>
        <span class="notification-badge">3</span>
      </button>

      <button class="profile-btn" (click)="op.toggle($event)">
        <span class="user-name">Daniel Caicedo</span>
        <i class="pi pi-chevron-down"></i>
      </button>

      <p-overlayPanel #op [showCloseIcon]="true">
        <div class="menu-item" (click)="goToProfile()">
          <i class="pi pi-user"></i> Ver Perfil
        </div>
        <div class="menu-item" (click)="openSettings()">
          <i class="pi pi-cog"></i> Configuración
        </div>
        <div class="menu-item logout" (click)="logout()">
          <i class="pi pi-sign-out"></i> Cerrar Sesión
        </div>
      </p-overlayPanel>
    </div>
  </div>
