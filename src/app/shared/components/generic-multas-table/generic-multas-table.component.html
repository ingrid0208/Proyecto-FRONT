<mat-card-content class="contenido">
  <div class="table-container">
    <table mat-table [dataSource]="multas" multiTemplateDataRows>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo de multa</th>
        <td mat-cell *matCellDef="let multa">{{ multa.tipo }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha de infraccion</th>
        <td mat-cell *matCellDef="let multa">{{ multa.fecha | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let multa">{{ multa.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="costo">
        <th mat-header-cell *matHeaderCellDef>Costo</th>
        <td mat-cell *matCellDef="let multa">{{ multa.costo | currency:'COP':'symbol' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let multa">
          <mat-chip [color]="chipColor(multa.estado)" selected>{{ multa.estado }}</mat-chip>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card-content>
