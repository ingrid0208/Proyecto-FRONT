<!-- Toast para mensajes -->
<p-toast></p-toast>

<!-- Loading overlay -->
<div *ngIf="isLoading" class="loading-overlay">
  <i class="pi pi-spin pi-spinner" style="font-size: 3rem"></i>
</div>

<div class="setting-container">
    <!-- Profile Info Section -->
    <div class="profile-info">
      <div class="avatar-container">
        <div class="profile-avatar">
          <span class="profile-initials">{{ getInitials() }}</span>
        </div>
        <span class="online-indicator"></span>
      </div>
      
      <div class="profile-details">
        <h2 class="profile-name">{{ getFullName() }}</h2>
      </div>
    </div>

    <!-- Edit Profile Section -->
    <div class="edit-profile-section">
      <div class="section-header">
        <h3>Perfil</h3>
        <span class="last-update"></span>
      </div>

      <!-- Form Content -->
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="form-sections">
          <!-- Personal Section -->
          <div class="form-section">
            <h4 class="section-title">Persona</h4>
            
            <div class="form-row">
              <div class="form-field">
                <label for="firstName">Nombre</label>
                <input
                  id="firstName"
                  type="text"
                  pInputText
                  formControlName="firstName"
                  placeholder="mobina"
                  [class.invalid]="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched"
                />
              </div>
              
              <div class="form-field">
                <label for="lastName">Apellido</label>
                <input
                  id="lastName"
                  type="text"
                  pInputText
                  formControlName="lastName"
                  placeholder="Mir"
                  [class.invalid]="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched"
                />
              </div>
            </div>


          </div>

          <!-- Contact Section -->
          <div class="form-section">
            <h4 class="section-title">Contacto</h4>
            
            <div class="form-row">
              <div class="form-field">
                <label for="email">Email</label>
                <input
                  id="email"
                  type="email"
                  pInputText
                  formControlName="email"
                  placeholder="Enter Value"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-field phone-field">
                <label for="phoneNumber">Número de Teléfono</label>
                <div class="phone-input">
                  <span class="country-code">+98</span>
                  <input
                    id="phoneNumber"
                    type="tel"
                    pInputText
                    formControlName="phoneNumber"
                    placeholder="912000000"
                    [class.invalid]="profileForm.get('phoneNumber')?.invalid && profileForm.get('phoneNumber')?.touched"
                  />
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="city">Ciudad</label>
                <input
                  id="city"
                  type="text"
                  pInputText
                  placeholder="software"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Save Button -->
        <div class="form-actions">
          <button
            type="submit"
            class="save-btn"
            [disabled]="!profileForm.valid || isSaving || isLoading"
          >
            Save
          </button>
        </div>
      </form>
    </div>
</div>
