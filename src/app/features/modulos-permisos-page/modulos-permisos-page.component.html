
<div class="modulos-container">
  <!-- Modal de alerta -->
  <div *ngIf="showAlert" class="alert-modal-overlay">
    <div class="alert-modal-content" [ngClass]="alertType">
      <span class="alert-icon" *ngIf="alertType === 'bienvenida'">👋</span>
      <span class="alert-icon" *ngIf="alertType === 'creado'">✅</span>
      <span class="alert-icon" *ngIf="alertType === 'eliminado'">🗑️</span>
      <span class="alert-msg">{{ alertMsg }}</span>
    </div>
  </div>

  <!-- Modal de confirmación de eliminación -->
  <div *ngIf="showConfirm" class="alert-modal-overlay">
    <div class="alert-modal-content eliminado">
      <span class="alert-icon">🗑️</span>
      <span class="alert-msg">¿Estás seguro de que deseas eliminar este módulo?</span>
      <div class="modal-actions">
        <button class="blue-btn" (click)="cancelarEliminar()">Cancelar</button>
        <button class="red-btn" (click)="confirmarEliminar()">Eliminar</button>
      </div>
    </div>
  </div>
  <div class="modulos-header">
    <span class="icon"><i class="material-icons">vpn_key</i></span>
    <span class="title">Permisos de Modulo</span>
    <button class="add-modulo-btn" (click)="abrirModal()">+ Agregar Módulo</button>
  </div>

  <div class="modulos-list">
  <div class="modulo-card" *ngFor="let modulo of modulos; let i = index">
      <div class="modulo-header">
        <span class="modulo-icon">{{ modulo.icono }}</span>
        <span class="modulo-nombre">{{ modulo.nombre }}</span>
      </div>
      <div class="modulo-acciones">
        <span *ngFor="let accion of modulo.acciones" class="accion-tag">{{ accion }}</span>
      </div>
      <div class="modulo-actions">
        <button class="red-btn" (click)="pedirConfirmacionEliminar(i)">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal para crear módulo -->
  <div *ngIf="showModal" class="modal-overlay">
    <div class="modal-content modal-modulo-form">
      <button class="modal-close" (click)="cerrarModal()" title="Cerrar">&times;</button>
      <div class="modal-icon-circle">
        <span class="modal-icon-preview">{{ nuevoModulo.icono || '🧩' }}</span>
      </div>
      <h2>Agregar Módulo</h2>
      <form (ngSubmit)="crearModulo()" autocomplete="off">
        <label>
          Icono (emoji):
          <input type="text" [(ngModel)]="nuevoModulo.icono" name="iconoModulo" maxlength="2" required placeholder="Ej: 🏦" />
        </label>
        <label>
          Nombre del Módulo:
          <input type="text" [(ngModel)]="nuevoModulo.nombre" name="nombreModulo" required placeholder="Ej: Finanzas" />
        </label>
        <div class="acciones-list">
          <span>Permisos:</span>
          <div class="acciones-grid">
            <label *ngFor="let accion of accionesDisponibles" class="accion-item">
              <input type="checkbox" [checked]="nuevoModulo.acciones.includes(accion)" (change)="toggleAccion(accion)" />
              {{ accion }}
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" (click)="cerrarModal()">Cancelar</button>
          <button type="submit" (click)="$event.preventDefault(); mostrarAlerta('Módulo creado exitosamente.', 'creado'); cerrarModal();">Crear</button>
        </div>
      </form>
    </div>
  </div>
</div>
